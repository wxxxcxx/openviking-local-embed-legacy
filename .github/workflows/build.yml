name: build-and-push

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - scripts/**
      - .github/workflows/build.yml

jobs:
  build:
    name: build-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/openviking-local-embed-legacy
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 只构建 amd64：目标是 J5005（Gemini Lake），只有 SSE4.2，
      # 没有 AVX/AVX2/FMA/F16C/BMI2。构建期会反汇编断言。
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            ISA=sse42
          tags: |
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Smoke test
        run: |
          docker pull "$IMAGE:latest"
          docker run --rm --entrypoint /app/.venv/bin/python "$IMAGE:latest" \
            -c "import llama_cpp, diskcache, platform; print('llama_cpp', llama_cpp.__version__, platform.machine())"

      - name: Verify manifest
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/openviking-local-embed-legacy
        run: |
          docker buildx imagetools inspect "$IMAGE:latest"
          {
            echo "### 镜像已推送"
            echo "- \`$IMAGE:latest\` — linux/amd64 only（SSE4.2 基线，适配 J5005 这类老 CPU）"
            echo "- 构建期已断言二进制不含 AVX/AVX2/BMI2 指令"
          } >> "$GITHUB_STEP_SUMMARY"
