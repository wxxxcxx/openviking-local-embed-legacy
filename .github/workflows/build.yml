name: build-and-push

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build.yml

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/openviking-cn

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:llama-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the pushed image
        run: |
          docker pull ${{ env.IMAGE }}:latest
          # 1 本地 embedding 依赖真的能用（不是只有文件在）
          docker run --rm --entrypoint /app/.venv/bin/python ${{ env.IMAGE }}:latest \
            -c "import llama_cpp; print('llama_cpp', llama_cpp.__version__)"
          # 2 服务端还是原样的入口
          docker run --rm --entrypoint openviking-entrypoint ${{ env.IMAGE }}:latest --help \
            | head -5

      - name: Summary
        run: |
          echo "### 推送成功" >> $GITHUB_STEP_SUMMARY
          echo "- 镜像：\`${{ env.IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- 平台：linux/amd64" >> $GITHUB_STEP_SUMMARY
          echo "- 拉取：\`docker pull ${{ env.IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
