name: build-and-push

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - scripts/**
      - .github/workflows/build.yml

jobs:
  build:
    name: build-${{ matrix.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 老 CPU（Gemini Lake / J5005 等）：只有 SSE4.2，没有 AVX/AVX2/FMA/F16C/BMI2
          - tag: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            isa: sse42
          - tag: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            isa: native
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    # 注意：secrets 不能写在 workflow 级 env，否则 job 根本不启动
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/openviking-local-embed-legacy
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.tag }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            ISA=${{ matrix.isa }}
          tags: |
            ${{ env.IMAGE }}:${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}

      - name: Smoke test ${{ matrix.tag }}
        run: |
          docker pull "$IMAGE:${{ matrix.tag }}"
          docker run --rm --platform ${{ matrix.platform }} \
            --entrypoint /app/.venv/bin/python "$IMAGE:${{ matrix.tag }}" \
            -c "import llama_cpp, diskcache, platform; print('llama_cpp', llama_cpp.__version__, platform.machine())"

  merge:
    name: merge-manifests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 合成多平台 latest
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/openviking-local-embed-legacy
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:latest" \
            "$IMAGE:amd64" \
            "$IMAGE:arm64"

      - name: Verify manifest
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/openviking-local-embed-legacy
        run: |
          docker buildx imagetools inspect "$IMAGE:latest"
          {
            echo "### 镜像已推送"
            echo "- \`$IMAGE:latest\` — linux/amd64（SSE4.2 基线，适配 J5005 这类老 CPU）+ linux/arm64"
            echo "- 构建期已断言 amd64 二进制不含 AVX/AVX2/BMI2 指令"
          } >> "$GITHUB_STEP_SUMMARY"
